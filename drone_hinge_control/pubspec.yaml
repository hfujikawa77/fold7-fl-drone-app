name: drone_hinge_control
description: "A Flutter application to control a MAVLink drone with the hinge angle of a foldable device."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  dart_mavlink: ^0.1.0
  dual_screen: ^1.0.4
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  latlong2: ^0.9.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
